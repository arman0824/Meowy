name: Bug report
description: Report a bug or unexpected behavior in Meowy
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Please fill in as much as you can so it is reproducible.
  - type: input
    id: meowy-version
    attributes:
      label: Meowy version
      description: The version shown in the app's Info.plist or release name.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: macos-version
    attributes:
      label: macOS version
      options:
        - "macOS 26 (Tahoe)"
        - "macOS 15 (Sequoia)"
        - "macOS 14 (Sonoma)"
        - "macOS 13 (Ventura)"
        - Other (please specify in description)
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions.
      placeholder: |
        1. Open Meowy.app
        2. Change ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Console output, crash reports, or screenshots if relevant. Do not include secrets.
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I am running a supported macOS version (13 or later)
          required: true