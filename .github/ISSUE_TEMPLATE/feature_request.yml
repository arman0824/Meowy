name: Feature request
description: Suggest an idea or improvement for Meowy
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please describe the use case and how you would expect it to work.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should Meowy do?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve, or what workflow would it improve?
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and any UX you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, related projects, or references.
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true